services:
  # 1. Flight Microservice
  - type: web
    name: flight-service
    env: docker
    dockerfilePath: ./DockerFile
    dockerCommand: uvicorn flight_service:app --host 0.0.0.0 --port $PORT
    plan: free

  # 2. Hotel Microservice
  - type: web
    name: hotel-service
    env: docker
    dockerfilePath: ./DockerFile
    dockerCommand: uvicorn hotel_service:app --host 0.0.0.0 --port $PORT
    plan: free

  # 3. Trip Orchestrator Service (LangGraph & Gemini)
  - type: web
    name: trip-orchestrator
    env: docker
    dockerfilePath: ./DockerFile
    dockerCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DUFFEL_API_KEY
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FLIGHT_SERVICE_HOST
        fromService:
          type: web
          name: flight-service
          property: host
      - key: FLIGHT_SERVICE_PORT
        fromService:
          type: web
          name: flight-service
          property: port
      - key: HOTEL_SERVICE_HOST
        fromService:
          type: web
          name: hotel-service
          property: host
      - key: HOTEL_SERVICE_PORT
        fromService:
          type: web
          name: hotel-service
          property: port

# 4. Streamlit Frontend UI
  - type: web
    name: streamlit-ui
    env: docker
    dockerfilePath: ./DockerFile
    # Change dockerCommand to run streamlit explicitly
    dockerCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    plan: free
    envVars:
      - key: ORCHESTRATOR_HOST
        fromService:
          type: web
          name: trip-orchestrator
          property: host
      - key: ORCHESTRATOR_PORT
        fromService:
          type: web
          name: trip-orchestrator
          property: port